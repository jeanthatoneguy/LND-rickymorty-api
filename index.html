<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Base de Datos Temática</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- Font Awesome (iconos redes) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS propio -->
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <section class="page">

    <header class="header">
      <div class="header__logo">
        <img src="assets/generic-logo.png" alt="Logo de la aplicación" />
        <span class="header__subtitle">Colección y Referencia</span>
      </div>

      <div class="header__controls">
        <input type="text" id="search-input" placeholder="Buscar por nombre..." />
        <button id="favorites-button">★</button>
      </div>
    </header>

    <aside class="sidebar">
      <h3>🔍 Opciones de Filtrado</h3>

      <label>Filtro Principal</label>
      <select></select>

      <label>Filtro Secundario</label>
      <select></select>

      <label>Ordenar por</label>
      <select>
        <option>A-Z</option>
        <option>Z-A</option>
      </select>
    </aside>

    <main id="main">

      <section class="detail-banner">
        <h2>Bienvenido a la Base de Datos</h2>
        <p>Usa los filtros o la búsqueda para explorar.</p>
        <div>Tema Actual: <strong>Cargando...</strong></div>
      </section>

    </main>

  </section>

  <footer class="footer-marvel">

    <!-- Redes -->
    <div class="social-icons">
      <a href="https://www.x.com/Marvel" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-x-twitter"></i>
      </a>
      <a href="https://www.instagram.com/marvel/" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://www.facebook.com/Marvel/" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-facebook-f"></i>
      </a>
      <a href="https://www.youtube.com/user/Marvel" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-youtube"></i>
      </a>
      <a href="https://discord.com/invite/marvel" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-discord"></i>
      </a>
    </div>

    <!-- Navegación -->
    <div class="footer-nav">
      <h5 class="footer-nav__title">Centro de Navegación</h5>

      <a href="https://www.marvel.com/characters" target="_blank" rel="noopener noreferrer">Characters</a>
      <a href="https://www.marvel.com/comics" target="_blank" rel="noopener noreferrer">Comics</a>
      <a href="https://www.marvel.com/movies" target="_blank" rel="noopener noreferrer">Movies</a>
      <a href="https://www.marvel.com/tv-shows" target="_blank" rel="noopener noreferrer">Series</a>
      <a href="https://www.marvel.com/contact" target="_blank" rel="noopener noreferrer">Contacto</a>
    </div>

  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    /* ======= Footer ajustado ======= */
    .footer-marvel {
      background: #b13030;
      color: #fff;
      padding: 40px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 40px;
    }

    .social-icons {
      display: flex;
      flex-direction: column;
      gap: 8px; /* más pegados */
      align-items: center;
    }

    .social-icons a {
      color: #fff;
      font-size: 22px;
    }

    .footer-nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
    }

    .footer-nav__title {
      font-weight: 700;
      margin-bottom: 10px;
    }

    .footer-nav a {
      color: #fff;
      text-decoration: none;
      font-size: 15px;
    }

    .footer-nav a:hover {
      text-decoration: underline;
    }
  </style>

</body>
</html>
